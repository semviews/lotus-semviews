# Frozen experiment configuration of the paper. Hyperparameters of semviews (shaping size 200, L2
# C=1, no shrinkage, 32 PCA row-embedding features, n grid, 40 quantile boundaries) were fixed on
# synthetic data and on the partial GoEmotions and PubMed tapes (pilot) before the full runs.
targets: {precision: 0.9, recall: 0.9, delta: 0.05}
# Operator configuration of the paper, on top of the CertConfig defaults above. Tuned on the
# pilot datasets only (experiments/improvements.py, rounds 1-3). The previous
# operator is the ablation `semviews_v1`.
operator:
  active_rounds: 8          # refit rounds before the regions are fixed
  active_chunk: 50          # floor of the refit batch
  active_chunk_frac: 0.05   # refit batch = 5% of the table (250 rows at 5,000)
  without_replacement: true # hypergeometric certification bounds
  plan_margin: 0.5
  delta_splits: [0.5, 0.7, 0.9]
datasets:
  pubmed: W1        # external predicate pool (ScaleDoc)
  goemotions: W3    # taxonomy-derived, human labels
  dbpedia: W3
  reviews: W2a      # analyst-style pool
orders: 20          # workload orders (seeds) for E2, E4, E5, E9
validity_seeds: 1000          # semviews (G2)
validity_seeds_baselines: 200
methods_main: [oracle_all, bargain_pr, bargain_views, lotus_cascade, lotus_cascade_full, proxy_lr, semviews_noviews, semviews,
               exact_cache, "sim_cache@0.7", "sim_cache@0.8", "sim_cache@0.9", sim_proxy, inferred_reuse, semweave]
methods_validity: [bargain_pr, lotus_cascade, lotus_cascade_full, proxy_lr, semviews_noviews, semviews,
                   "sim_cache@0.7", "sim_cache@0.8", "sim_cache@0.9", sim_proxy, inferred_reuse]
ablations: [semviews_strata, semviews_noemb, semviews_nohelper, semviews_noviews_noemb, semviews_allviews, semviews_shape100, semviews_shape400]
w0:
  size: 8   # greedy minimax |phi| selection; achieved max |phi| is reported
sensitivity:
  targets: [[0.8, 0.8], [0.9, 0.9], [0.95, 0.95], [0.95, 0.8], [0.8, 0.95]]
  delta: [0.01, 0.05, 0.1, 0.2]
  table_rows: [1000, 2500, 5000]
partial_coverage: [0.1, 0.25, 0.5, 0.75, 1.0]
